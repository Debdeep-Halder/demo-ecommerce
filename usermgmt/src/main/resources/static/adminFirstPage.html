<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Console</title>
  <style>
    :root { --bg:#0f172a; --card:#111827; --text:#e5e7eb; --accent:#3b82f6; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, system-ui, Arial, sans-serif; background:#0f172a; color:var(--text); }
    header { padding:16px 20px; background:#0b1324; border-bottom:1px solid #25314a; display:flex; align-items:center; justify-content:space-between;}
    h1 { margin:0; font-size:18px; }
    main { padding:20px; max-width: 960px; margin: 0 auto; }
    .btn { padding:8px 12px; border-radius:8px; border:1px solid #374151; background:#0f162b; color:var(--text); cursor:pointer; font-weight:600; font-size:13px;}
    .btn:hover { border-color: var(--accent); }
    .msg { margin-top:10px; font-size:13px; min-height:18px }
    .msg.error { color:#fca5a5 }
    .msg.ok { color:#86efac }
    .row-actions { display:flex; gap:6px; }

    .backdrop { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.55); }
    .modal { width: min(95vw, 1000px); background:#111827; border:1px solid #374151; border-radius:14px; overflow:hidden; }
    .modal header { padding:12px 14px; background:#0b1324; border-bottom:1px solid #25314a; display:flex; align-items:center; justify-content:space-between;}
    .modal .content { padding:14px; }
    table { width:100%; border-collapse:collapse; margin-top:8px; }
    th, td { text-align:left; padding:10px; border-bottom:1px solid #25314a; font-size:14px; }
    th { background:#0b1324; position:sticky; top:0; }
    pre { white-space:pre-wrap; word-break:break-word; background:#0f162b; border:1px solid #25314a; padding:10px; border-radius:8px; max-height:60vh; overflow:auto; }
  </style>
</head>
<body>
  <header>
    <h1>Admin Console</h1>
    <button class="btn" id="logoutBtn">Logout</button>
  </header>

  <main>
    <p>Welcome, Admin! Use the buttons below to manage approvals, users, and view metrics.</p>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn" id="openApprovals">Approval Requests</button>
      <button class="btn" id="openUsers">View All Users</button>
      <button class="btn" id="openMetrics">Metrics</button>
    </div>
    <div class="msg" id="statusMsg"></div>
  </main>

  <!-- Approvals Modal -->
  <div class="backdrop" id="approvalsBackdrop">
    <div class="modal">
      <header>
        <h3>Pending Approval Requests</h3>
        <button class="btn" id="closeApprovals">Close</button>
      </header>
      <div class="content">
        <div class="msg" id="approvalsMsg"></div>
        <div style="max-height:60vh; overflow:auto;">
          <table id="approvalsTable">
            <thead>
              <tr>
                <th>Username</th><th>Email</th><th>Role</th>
                <th>Status</th><th>Requested At</th><th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- All Users Modal -->
  <div class="backdrop" id="usersBackdrop">
    <div class="modal">
      <header>
        <h3>All Registered Users</h3>
        <button class="btn" id="closeUsers">Close</button>
      </header>
      <div class="content">
        <div class="msg" id="usersMsg"></div>
        <div style="max-height:60vh; overflow:auto;">
          <table id="usersTable">
            <thead>
              <tr><th>Username</th><th>Email</th><th>Role</th><th>Actions</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Metrics (Prometheus) Modal -->
  <div class="backdrop" id="metricsBackdrop">
    <div class="modal">
      <header>
        <h3>Prometheus Metrics</h3>
        <button class="btn" id="closeMetrics">Close</button>
      </header>
      <div class="content">
        <div class="msg" id="metricsMsg"></div>
        <pre id="metricsPre">Loading…</pre>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const statusMsg = document.getElementById('statusMsg');
    if (!token) {
      statusMsg.textContent = 'No session found. Please log in as ADMIN.';
      statusMsg.className = 'msg error';
    }

    // Backdrops
    const approvalsBackdrop = document.getElementById('approvalsBackdrop');
    const usersBackdrop = document.getElementById('usersBackdrop');
    const metricsBackdrop = document.getElementById('metricsBackdrop');

    // Buttons
    document.getElementById('logoutBtn').onclick = logout;
    document.getElementById('openApprovals').onclick = loadApprovals;
    document.getElementById('closeApprovals').onclick = () => approvalsBackdrop.style.display='none';
    document.getElementById('openUsers').onclick = loadUsers;
    document.getElementById('closeUsers').onclick = () => usersBackdrop.style.display='none';
    document.getElementById('openMetrics').onclick = loadMetrics;
    document.getElementById('closeMetrics').onclick = () => metricsBackdrop.style.display='none';

    // ---- Approvals ----
	
	async function logout() {
	  const token = localStorage.getItem("token");
	  if (!token) {
	    window.location.href = "/firstPage.html";
	    return;
	  }

	  try {
	    const res = await fetch('/users/logout', {
	      method: 'POST',
	      headers: {
	        'Authorization': 'Bearer ' + token
	      }
	    });

	    // Whether success or token already invalid, remove and redirect
	    localStorage.removeItem('token');
	    window.location.href = '/firstPage.html';

	  } catch (error) {
	    console.error("Logout failed:", error);
	    localStorage.removeItem('token');
	    window.location.href = '/firstPage.html';
	  }
	};

	
    async function loadApprovals() {
      const tbody = document.querySelector('#approvalsTable tbody');
      const msg = document.getElementById('approvalsMsg');
      approvalsBackdrop.style.display = 'flex';
      tbody.innerHTML = ''; msg.textContent = 'Loading...'; msg.className='msg';
      try {
        const res = await fetch('/users/requests', { headers:{Authorization:'Bearer '+token}});
        if(!res.ok) throw new Error(await res.text());
        const data = await res.json();
        msg.textContent = '';
        if(!data.length) { msg.textContent='No pending requests.'; msg.className='msg ok'; return; }
        data.forEach(r=>{
          const tr=document.createElement('tr');
          tr.innerHTML=`<td>${r.requestorUsername}</td><td>${r.requestorEmail}</td><td>${r.role}</td><td>${r.status}</td><td>${r.requestTime}</td>
            <td class='row-actions'><button class='btn' data-id='${r.id}' data-action='approve'>Approve</button>
            <button class='btn' data-id='${r.id}' data-action='reject'>Reject</button></td>`;
          tbody.appendChild(tr);
        });
        tbody.querySelectorAll('button[data-action]').forEach(b=>{
          b.onclick=()=>handleApprovalAction(b.dataset.id,b.dataset.action,msg,loadApprovals);
        });
      } catch(e){ msg.textContent='Failed: '+e.message; msg.className='msg error'; }
    }

    async function handleApprovalAction(id, action, msg, refresh) {
      try {
        const res = await fetch(`/users/requests/${action}/${id}`, {method:'PUT', headers:{Authorization:'Bearer '+token}});
        const text=await res.text();
        msg.textContent=text; msg.className=res.ok?'msg ok':'msg error';
        if(res.ok) refresh();
      } catch(e){ msg.textContent='Action failed: '+e.message; msg.className='msg error'; }
    }

    // ---- Users ----
    async function loadUsers(){
      const tbody=document.querySelector('#usersTable tbody');
      const msg=document.getElementById('usersMsg');
      usersBackdrop.style.display='flex';
      tbody.innerHTML=''; msg.textContent='Loading...'; msg.className='msg';
      try{
        const res=await fetch('/users/allUsers',{headers:{Authorization:'Bearer '+token}});
        if(!res.ok) throw new Error(await res.text());
        const data=await res.json();
        msg.textContent='';
        if(!data.length){ msg.textContent='No users found.'; msg.className='msg ok'; return; }
        data.forEach(u=>{
          const tr=document.createElement('tr');
          tr.innerHTML=`<td>${u.username}</td><td>${u.email}</td><td>${u.role?.name||u.role}</td>
                        <td class='row-actions'><button class='btn' data-user='${u.username}' data-email='${u.email}' data-role='${u.role?.name||u.role}'>Delete</button></td>`;
          tbody.appendChild(tr);
        });
        tbody.querySelectorAll('button[data-user]').forEach(b=>{
          b.onclick=()=>handleDelete(b.dataset.user,b.dataset.email,b.dataset.role,msg,loadUsers);
        });
      }catch(e){ msg.textContent='Error: '+e.message; msg.className='msg error'; }
    }

    async function handleDelete(username,email,role,msg,refresh){
      if(!confirm(`Delete ${username}? This cannot be undone.`)) return;
      try{
        const url=`/users/delete?username=${encodeURIComponent(username)}&email=${encodeURIComponent(email)}&role=${encodeURIComponent(role)}`;
        const res=await fetch(url,{method:'DELETE',headers:{Authorization:'Bearer '+token}});
        const text=await res.text();
        msg.textContent=text; msg.className=res.ok?'msg ok':'msg error';
        if(res.ok) refresh();
      }catch(e){ msg.textContent='Delete failed: '+e.message; msg.className='msg error'; }
    }

    // ---- Metrics (Prometheus) ----
    async function loadMetrics(){
      const msg = document.getElementById('metricsMsg');
      const pre = document.getElementById('metricsPre');
      metricsBackdrop.style.display='flex';
      msg.textContent = 'Loading...'; msg.className='msg'; pre.textContent='';
      try{
        const res = await fetch('/actuator/prometheus', { headers:{ Authorization:'Bearer '+token }});
        const text = await res.text();
        if(!res.ok) throw new Error(text || ('HTTP '+res.status));
        msg.textContent=''; pre.textContent = text;
      }catch(e){
        msg.textContent='Failed to load metrics: '+e.message;
        msg.className='msg error';
        pre.textContent='';
      }
    }
  </script>
</body>
</html>
